name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run check:functions
      - run: node scripts/check-brand-strings.mjs
      - run: npm test
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build

  database-permissions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: share_review_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Test sharing as authenticated and anonymous roles
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d share_review_test -f scripts/test-share-ownership.sql
