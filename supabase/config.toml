# The scheduler calls these without a user JWT; the functions authenticate the
# x-cron-key header themselves (_shared/cron-auth.ts). Without these entries a
# redeploy could flip them to verify_jwt = true and the gateway would reject
# every scheduled run before the function even sees it.
[functions.profile-audit]
verify_jwt = false

[functions.wiki-restructure]
verify_jwt = false

# Preserve the live setting; the handler validates the caller with auth.getUser.
[functions.merge-contacts]
verify_jwt = false

# Called by the two-minute Drive backstop and the hourly watch renewal (cron.job
# 9 and 10) with an x-cron-key header and no user JWT, and by the app with a
# user JWT the function checks itself. Neither had an entry here, so a redeploy
# could flip them to verify_jwt = true and every scheduled run would be refused
# at the gateway before the function saw it.
[functions.gdrive-sync]
verify_jwt = false

[functions.gdrive-watch-maintenance]
verify_jwt = false

# Every deployed function on this project runs with verify_jwt = false and
# authenticates inside the handler (checked live 2026-09-16: 91 of 91). A deploy
# applies this file, and a function with no entry flips to verify_jwt = true, so
# each function redeployed that day is pinned to the setting it already had.
[functions.admin-llm-config]
