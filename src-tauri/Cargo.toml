[package]
name = "menerio-desktop"
version = "0.1.0"
description = "Menerio desktop client"
authors = ["Michael Zelbel"]
edition = "2021"

[lib]
name = "menerio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
